<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <h1>Calculadora</h1>
    <form action="/" method="get">
        <label for="a">Primer numero</label>
        <input type="number" id="a" name="a" min="-99999" max="99999" step="1" required>

        <label for="operacion">Operacion</label>
        <select id="operacion" name="operacion">
            <option value="suma">Suma (+)</option>
            <option value="resta">Resta (-)</option>
            <option value="multiplicacion">Multiplicacion (x)</option>
            <option value="potencia">Potencia (^)</option>
        </select>

        <label for="b">Segundo numero</label>
        <input type="number" id="b" name="b" min="-99999" max="99999" step="1" required>

        <button type="submit">Calcular</button>
    </form>
    <p id="resultado">{{resultado}}</p>
</body>
</html>
